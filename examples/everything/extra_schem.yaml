YAML Config:
  aliases:
    docker:
      type: action
      image: debian:stable-slim
      default: docker run --rm -e script "$image" sh -c "$script"
  YAML_ENABLED: true
  YAML_DOCKER_AVAILABLE:
    type: external
    default: command -v docker
  YAML_THREADS:
    default: 4
    deps: YAML_ENABLED
  YAML_LEVEL:
    default: INFO
    choices: [DEBUG, INFO, ERROR]
    deps: YAML_ENABLED && YAML_THREADS > 1
  YAML_HELLO:
    type: action
    default: |
      echo "Hello from YAML"
      sleep 2
    deps: YAML_ENABLED
  YAML_BUILD:
    type: action
    deps: YAML_ENABLED
    default: |
      set -e
      echo "Building..."
      mkdir -p build
      cd build
      echo done > result.txt
      sleep 2
  YAML_DEPLOY:
    type: action
    needs: YAML_HELLO() && YAML_BUILD()
    default: |
      echo "Deploying..."
      sleep 2
  YAML_DEBIAN:
    type: docker
    deps: YAML_ENABLED && YAML_DOCKER_AVAILABLE
    script: |
      set -e
      echo "Hello from $(head -1 /etc/os-release)"
      sleep 2
